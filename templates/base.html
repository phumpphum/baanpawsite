<!doctype html>
<html lang="th" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Baanpaw Shop - Modern inventory and sales management system">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Baanpaw Shop{% endblock %}</title>

  <!-- Prevent theme flash -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('baanpaw-theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
      } catch (e) {
        console.warn('Theme preference not available:', e);
      }
    })();
  </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom Styles -->
<style>
  :root {
    --nav-height: 70px;

    /* Luxury Palette - Light Mode */
    --bg-body: #f9fafb;
    --surface: #ffffff;
    --surface-glass: rgba(255, 255, 255, 0.9);
    
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;

    --primary-color: #0f172a; /* Slate 900 */
    --primary-hover: #1e293b;
    --accent-color: #6366f1;

    --border-color: #e5e7eb;
    --border-hover: #d1d5db;

    --radius-lg: 12px;
    --radius-md: 8px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    
    /* Status Colors */
    --success-bg: #ecfdf5; --success-text: #059669;
    --danger-bg: #fef2f2; --danger-text: #dc2626;
    --warning-bg: #fffbeb; --warning-text: #d97706;
    --info-bg: #eff6ff; --info-text: #3b82f6;
  }

  [data-bs-theme="dark"] {
    /* Luxury Palette - Dark Mode */
    --bg-body: #111827; /* Gray 900 */
    --surface: #1f2937; /* Gray 800 */
    --surface-glass: rgba(31, 41, 55, 0.9);
    
    --text-primary: #f9fafb;
    --text-secondary: #9ca3af;
    --text-tertiary: #6b7280;

    --primary-color: #f3f4f6;
    --primary-hover: #e5e7eb;
    
    --border-color: #374151;
    --border-hover: #4b5563;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }

  * {
    transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-body);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Navbar */
  .modern-navbar {
    background: var(--surface-glass);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 1040;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.75rem 0;
  }

  .navbar-brand {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary) !important;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    letter-spacing: -0.025em;
  }
  
  .navbar-brand i {
    color: var(--text-primary);
  }

  /* Nav Links */
  .navbar-nav {
    gap: 0.25rem;
  }

  .modern-nav-link {
    padding: 0.5rem 1rem !important;
    border-radius: var(--radius-md);
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text-secondary) !important;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s ease;
  }

  .modern-nav-link:hover {
    background: var(--bg-body);
    color: var(--text-primary) !important;
  }

  .modern-nav-link.active {
    background: var(--text-primary);
    color: var(--surface) !important;
    box-shadow: var(--shadow-sm);
  }

  .modern-nav-link.active i {
    color: var(--surface);
  }

  /* Clock Widget */
  .clock-widget {
    background: var(--bg-body);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-full);
    font-family: 'Inter', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Theme Toggle */
  .theme-toggle-container {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.35rem 0.75rem;
    background: var(--bg-body);
    border-radius: var(--radius-full);
    border: 1px solid var(--border-color);
  }

  .theme-toggle {
    width: 40px;
    height: 22px;
    appearance: none;
    background: #cbd5e1;
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    outline: none;
    transition: background 0.3s;
  }

  .theme-toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    transition: transform 0.3s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }

  .theme-toggle:checked {
    background: var(--text-primary);
  }

  .theme-toggle:checked::after {
    transform: translateX(18px);
  }

  .theme-icon {
    font-size: 1rem;
    color: var(--text-secondary);
  }

  /* Toggler Icon Override */
  .navbar-toggler {
    border: 1px solid var(--border-color);
    padding: 0.25rem 0.5rem;
    border-radius: var(--radius-md);
  }
  
  .navbar-toggler:focus {
    box-shadow: none;
    border-color: var(--text-primary);
  }

  .navbar-toggler-icon {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(17, 24, 39, 0.75)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
  }
  
  [data-bs-theme="dark"] .navbar-toggler-icon {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(249, 250, 251, 0.75)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
  }

  /* Toasts */
  .modern-toast {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    min-width: 300px;
  }

  .modern-toast.success { border-left: 4px solid var(--success-text); }
  .modern-toast.error { border-left: 4px solid var(--danger-text); }
  .modern-toast.warning { border-left: 4px solid var(--warning-text); }
  .modern-toast.info { border-left: 4px solid var(--info-text); }

  .toast-icon {
    font-size: 1.25rem;
    margin-right: 0.75rem;
  }
  
  .modern-toast.success .toast-icon { color: var(--success-text); }
  .modern-toast.error .toast-icon { color: var(--danger-text); }
  .modern-toast.warning .toast-icon { color: var(--warning-text); }
  .modern-toast.info .toast-icon { color: var(--info-text); }

  .toast-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
  .toast-message { font-size: 0.85rem; color: var(--text-secondary); }

  /* Main Content */
  main {
    flex: 1;
    padding-top: 2rem;
    padding-bottom: 3rem;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  /* Mobile */
  @media (max-width: 991.98px) {
    .navbar-nav { padding-top: 1rem; }
    .modern-nav-link { width: 100%; margin-bottom: 0.25rem; }
    .clock-widget, .theme-toggle-container { margin-top: 1rem; width: 100%; justify-content: center; }
  }
</style>

  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Skip to main content -->
  <a href="#main-content" class="visually-hidden-focusable">Skip to main content</a>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg modern-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="{% url 'home' %}">
        <i class="bi bi-box-seam-fill"></i> Baanpaw
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="modern-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
              <i class="bi bi-grid"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="modern-nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}" href="{% url 'product_list' %}">
              <i class="bi bi-box"></i> Products
            </a>
          </li>
          <li class="nav-item">
            <a class="modern-nav-link {% if request.resolver_match.url_name == 'product_create' %}active{% endif %}" href="{% url 'product_create' %}">
              <i class="bi bi-plus-circle"></i> Add
            </a>
          </li>
          <li class="nav-item">
            <a class="modern-nav-link {% if request.resolver_match.url_name == 'sale_create' %}active{% endif %}" href="{% url 'sale_create' %}">
              <i class="bi bi-cart"></i> Sale
            </a>
          </li>
          <li class="nav-item">
            <a class="modern-nav-link {% if request.resolver_match.url_name == 'sales_history' %}active{% endif %}" href="{% url 'sales_history' %}">
              <i class="bi bi-clock-history"></i> History
            </a>
          </li>
          <li class="nav-item">
            <a class="modern-nav-link {% if request.resolver_match.url_name == 'sales_report' %}active{% endif %}" href="{% url 'sales_report' %}">
              <i class="bi bi-graph-up"></i> Reports
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3 flex-wrap">
          <!-- Clock -->
          <div class="clock-widget">
            <i class="bi bi-clock"></i>
            <span id="clock">--:--</span>
          </div>

          <!-- Theme Toggle -->
          <div class="theme-toggle-container">
            <i class="bi bi-sun-fill theme-icon"></i>
            <input type="checkbox" class="theme-toggle" id="themeToggler" aria-label="Toggle dark mode">
            <i class="bi bi-moon-fill theme-icon"></i>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container-fluid px-4" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast Notification -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast modern-toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex p-3 align-items-start">
        <div class="toast-icon" id="toastIcon"></div>
        <div class="w-100">
          <div class="d-flex justify-content-between">
            <div class="toast-title" id="toastTitle">Notification</div>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-message" id="toastMessage"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>

  <script>
    'use strict';

    // Theme Management
    const THEME_KEY = 'baanpaw-theme';
    const toggler = document.getElementById('themeToggler');
    
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      const isDark = savedTheme === 'dark';
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
      if (toggler) toggler.checked = isDark;
    }

    if (toggler) {
      toggler.addEventListener('change', function() {
        const theme = this.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem(THEME_KEY, theme);
      });
    }
    initTheme();

    // Clock
    function updateClock() {
      const el = document.getElementById('clock');
      if (el) {
        const now = new Date();
        el.textContent = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Toast System
    window.notify = function(message, type = 'success', title = null) {
      const toastEl = document.getElementById('toast');
      const toastIcon = document.getElementById('toastIcon');
      const toastTitle = document.getElementById('toastTitle');
      const toastMessage = document.getElementById('toastMessage');
      
      if (!toastEl) return;

      // Reset classes
      toastEl.className = `toast modern-toast ${type}`;
      
      // Icons
      const icons = {
        success: '<i class="bi bi-check-circle-fill"></i>',
        error: '<i class="bi bi-x-circle-fill"></i>',
        warning: '<i class="bi bi-exclamation-triangle-fill"></i>',
        info: '<i class="bi bi-info-circle-fill"></i>'
      };
      
      // Defaults
      const titles = {
        success: 'Success',
        error: 'Error',
        warning: 'Warning',
        info: 'Information'
      };

      toastIcon.innerHTML = icons[type] || icons.success;
      toastTitle.textContent = title || titles[type];
      toastMessage.textContent = message;

      const toast = new bootstrap.Toast(toastEl);
      toast.show();
    };
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
