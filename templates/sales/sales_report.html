{% extends 'base.html' %}
{% block title %}Sales Report{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
    :root {
        --font-main: 'Prompt', sans-serif;
        --bg-body: #f8f9fa;
        --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        --card-radius: 16px;
        --primary-soft: #eef2ff;
        --primary-text: #4f46e5;
        --success-soft: #ecfdf5;
        --success-text: #10b981;
        --warning-soft: #fffbeb;
        --warning-text: #f59e0b;
        --info-soft: #eff6ff;
        --info-text: #3b82f6;
    }

    body {
        font-family: var(--font-main);
        background-color: var(--bg-body);
        color: #334155;
    }

    /* Modern Card Style */
    .modern-card {
        background: #ffffff;
        border: none;
        border-radius: var(--card-radius);
        box-shadow: var(--card-shadow);
        padding: 24px;
        transition: transform 0.2s ease;
    }

    /* Inputs & Selects */
    .form-control, .form-select {
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        padding: 10px 15px;
        font-size: 0.95rem;
    }
    .form-control:focus, .form-select:focus {
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        border-color: var(--primary-text);
    }
    .form-label {
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 6px;
    }

    /* KPI Cards Styling */
    .kpi-card-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .kpi-icon-box {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
    }
    .kpi-data {
        text-align: right;
    }
    .kpi-label {
        font-size: 0.9rem;
        color: #64748b;
        font-weight: 500;
    }
    .kpi-value {
        font-size: 1.85rem;
        font-weight: 600;
        line-height: 1.2;
        color: #1e293b;
    }
    .kpi-sub {
        font-size: 0.8rem;
        margin-top: 4px;
        color: #94a3b8;
    }

    /* Colors for KPIs */
    .kpi-primary .kpi-icon-box { background: var(--primary-soft); color: var(--primary-text); }
    .kpi-success .kpi-icon-box { background: var(--success-soft); color: var(--success-text); }
    .kpi-warning .kpi-icon-box { background: var(--warning-soft); color: var(--warning-text); }
    .kpi-info .kpi-icon-box { background: var(--info-soft); color: var(--info-text); }

    /* Preset Buttons */
    .btn-preset {
        border: 1px solid #e2e8f0;
        background: white;
        color: #64748b;
        border-radius: 50px; /* Pill shape */
        padding: 6px 16px;
        font-size: 0.9rem;
        transition: all 0.2s;
    }
    .btn-preset:hover {
        background: #f1f5f9;
    }
    .btn-preset.active {
        background: var(--primary-text) !important;
        color: white !important;
        border-color: var(--primary-text) !important;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    /* Charts */
    .chart-header {
        font-size: 1.1rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 20px;
    }
</style>

<div class="container-fluid py-4">

    <div class="modern-card mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label class="form-label">Start Date</label>
                <input type="date" id="start" class="form-control" value="{{ start }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">End Date</label>
                <input type="date" id="end" class="form-control" value="{{ end }}">
            </div>

            <div class="col-md-3">
                <label class="form-label">Product</label>
                <select id="product" class="form-select">
                    <option value="">All Products</option>
                    {% for p in products %}
                    <option value="{{ p.id }}" {% if selected_product|stringformat:"s" == p.id|stringformat:"s" %}selected{% endif %}>
                        {{ p.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">View By</label>
                <select id="granularity" class="form-select">
                    <option value="day" {% if granularity == 'day' %}selected{% endif %}>Daily</option>
                    <option value="month" {% if granularity == 'month' %}selected{% endif %}>Monthly</option>
                </select>
            </div>

            <div class="col-md-3 text-end">
                <button id="download" class="btn btn-dark w-100" style="border-radius: 10px; padding: 10px;">
                    <i class="bi bi-cloud-download me-2"></i> Export CSV
                </button>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4 pt-3 border-top">
            <small class="text-muted align-self-center me-2">Quick Select:</small>
            <button class="btn btn-preset" data-range="today">Today</button>
            <button class="btn btn-preset" data-range="7d">Last 7 Days</button>
            <button class="btn btn-preset" data-range="30d">Last 30 Days</button>
            <button class="btn btn-preset" data-range="thism">This Month</button>
            <button class="btn btn-preset" data-range="lastm">Last Month</button>
            <button class="btn btn-preset" data-range="all">All Time</button>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="modern-card kpi-primary">
                <div class="kpi-card-inner">
                    <div class="kpi-icon-box">
                        <i class="bi bi-currency-dollar"></i>
                    </div>
                    <div class="kpi-data">
                        <div class="kpi-label">Total Revenue</div>
                        <div id="kpi-amount" class="kpi-value">0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="modern-card kpi-success">
                <div class="kpi-card-inner">
                    <div class="kpi-icon-box">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div class="kpi-data">
                        <div class="kpi-label">Total Quantity</div>
                        <div id="kpi-qty" class="kpi-value">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="modern-card kpi-warning">
                <div class="kpi-card-inner">
                    <div class="kpi-icon-box">
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>
                    <div class="kpi-data">
                        <div class="kpi-label">Net Profit</div>
                        <div id="kpi-profit" class="kpi-value">0.00</div>
                    </div>
                </div>
                <div id="kpi-profit-avg" class="kpi-sub text-end mt-2"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="modern-card kpi-info">
                <div class="kpi-card-inner">
                    <div class="kpi-icon-box">
                        <i class="bi bi-pie-chart"></i>
                    </div>
                    <div class="kpi-data">
                        <div class="kpi-label">Margin</div>
                        <div id="kpi-margin" class="kpi-value">0%</div>
                    </div>
                </div>
                <div id="kpi-roi" class="kpi-sub text-end mt-2"></div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-12">
            <div class="modern-card">
                <div class="chart-header"><i class="bi bi-bar-chart-line me-2"></i>Revenue Trend</div>
                <div style="height: 300px;">
                    <canvas id="amountChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="modern-card">
                <div class="chart-header"><i class="bi bi-boxes me-2"></i>Quantity Sold</div>
                <div style="height: 250px;">
                    <canvas id="qtyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="modern-card">
                <div class="chart-header"><i class="bi bi-cash-coin me-2"></i>Profit Growth</div>
                <div style="height: 250px;">
                    <canvas id="profitChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const fmt = n => Number(n||0).toLocaleString('th-TH', {minimumFractionDigits: 2});

    let amountChart, qtyChart, profitChart;

    // Modern Chart Options
    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: 'rgba(30, 41, 59, 0.9)',
                padding: 12,
                cornerRadius: 8,
                titleFont: { family: 'Prompt', size: 14 },
                bodyFont: { family: 'Prompt', size: 13 }
            }
        },
        scales: {
            y: {
                beginAtZero: true,
                grid: { color: '#f1f5f9', borderDash: [5, 5] },
                ticks: { font: { family: 'Prompt' }, color: '#94a3b8' },
                border: { display: false }
            },
            x: {
                grid: { display: false },
                ticks: { font: { family: 'Prompt' }, color: '#64748b' },
                border: { display: false }
            }
        }
    };

    /* ---------------- LOAD DATA ---------------- */
    async function loadData() {
        const params = new URLSearchParams({
            start: $('#start').value,
            end: $('#end').value,
            g: $('#granularity').value,
            product: $('#product').value
        });
        
        try {
            const res = await fetch(`/api/sales/series/?${params}`);
            if(!res.ok) throw new Error("API Error");
            const data = await res.json();

            // Calculate KPIs
            const { amount: totalRev, qty: totalQty, profit: totalProfit, cost: totalCost } = data.totals;

            $('#kpi-amount').textContent = fmt(totalRev);
            $('#kpi-qty').textContent = Number(totalQty).toLocaleString();
            $('#kpi-profit').textContent = fmt(totalProfit);

            const avgProfit = totalQty ? totalProfit / totalQty : 0;
            $('#kpi-profit-avg').innerHTML = `<i class="bi bi-caret-up-fill text-success"></i> Avg: ${fmt(avgProfit)}`;

            const margin = totalRev ? (totalProfit / totalRev * 100) : 0;
            $('#kpi-margin').textContent = margin.toFixed(1) + "%";

            const roi = totalCost ? (totalProfit / totalCost * 100) : 0;
            $('#kpi-roi').innerHTML = `<span class="badge bg-light text-dark">ROI ${roi.toFixed(1)}%</span>`;

            // Update Charts
            updateChart(amountChart, 'amountChart', data.labels, data.amounts, 'Revenue', '#4f46e5');
            updateChart(qtyChart, 'qtyChart', data.labels, data.qtys, 'Quantity', '#10b981');
            updateChart(profitChart, 'profitChart', data.labels, data.profits, 'Profit', '#f59e0b');

        } catch(e) {
            console.error(e);
        }
    }

    function updateChart(chartInstance, id, labels, values, label, color) {
        const ctx = document.getElementById(id);
        const config = {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    label: label,
                    data: values,
                    backgroundColor: color,
                    borderRadius: 4, // Rounded bars
                    barPercentage: 0.6
                }]
            },
            options: commonOptions
        };

        // If chart exists, destroy or update. Here simplified to destroy/create
        const chartVarName = id === 'amountChart' ? 'amountChart' : id === 'qtyChart' ? 'qtyChart' : 'profitChart';
        
        // Note: In global scope managing instances is tricky inside function, 
        // ideally store in object. For this snippet:
        if (id === 'amountChart') {
            if (amountChart) amountChart.destroy();
            amountChart = new Chart(ctx, config);
        } else if (id === 'qtyChart') {
            if (qtyChart) qtyChart.destroy();
            qtyChart = new Chart(ctx, config);
        } else if (id === 'profitChart') {
            if (profitChart) profitChart.destroy();
            profitChart = new Chart(ctx, config);
        }
    }

    /* ---------------- PRESETS LOGIC ---------------- */
    function getPresetDates(range) {
        const today = new Date();
        const pad = n => String(n).padStart(2, '0');
        const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

        let s, e = today;

        if (range === 'today') { s = today; }
        else if (range === '7d') { s = new Date(today); s.setDate(s.getDate() - 6); }
        else if (range === '30d') { s = new Date(today); s.setDate(s.getDate() - 29); }
        else if (range === 'thism') { s = new Date(today.getFullYear(), today.getMonth(), 1); }
        else if (range === 'lastm') {
            s = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            e = new Date(today.getFullYear(), today.getMonth(), 0);
        }
        else if (range === 'all') { return { start: "", end: "" }; }

        return { start: fmtDate(s), end: fmtDate(e) };
    }

    $$('.btn-preset').forEach(btn => {
        btn.addEventListener('click', () => {
            const range = btn.dataset.range;
            const { start, end } = getPresetDates(range);
            
            $('#start').value = start;
            $('#end').value = end;

            $$('.btn-preset').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            loadData();
        });
    });

    // Event Listeners
    $('#start').addEventListener('change', loadData);
    $('#end').addEventListener('change', loadData);
    $('#granularity').addEventListener('change', loadData);
    $('#product').addEventListener('change', loadData);

    // Init
    loadData();
</script>
{% endblock %}
