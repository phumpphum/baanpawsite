<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Baanpaw Pets — Links</title>
  <meta name="description" content="Baanpaw official links: LINE OA, Shopee, Instagram" />
  <meta name="theme-color" content="#dacfb9" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Palette */
      --bg-gradient: linear-gradient(-45deg, #e3dac9, #d4c5b0, #c4b59d, #e6dec1);
      --surface: rgba(255, 255, 255, 0.75);
      --surface-hover: rgba(255, 255, 255, 0.95);
      --text-main: #5e503f;
      --text-sub: #8c7b66;
      --shadow-soft: 0 8px 32px rgba(94, 80, 63, 0.15);
      --shadow-hover: 0 12px 40px rgba(94, 80, 63, 0.25);
      --radius: 28px;
      --anim-speed: 0.3s;
    }

    * { box-sizing: border-box; }

    /* แก้ไขจุดที่ทำให้เกิดขอบขาว */
    html {
      height: 100%;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      background-attachment: fixed; /* ล็อกพื้นหลังไม่ให้เลื่อนตามเนื้อหา */
      animation: gradientBG 15s ease infinite;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      /* รองรับความสูงแบบ Dynamic ของมือถือ */
      min-height: 100dvh; 
      color: var(--text-main);
      overflow-x: hidden;
      
      /* ทำให้ body โปร่งใส เพื่อให้เห็นสีจาก html */
      background-color: transparent; 
      
      /* ดันเนื้อหาหลบ Safe Area ของ iPhone */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .wrap {
      /* ใช้ความสูงเต็มพื้นที่ที่เหลือ */
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      backdrop-filter: blur(0px); 
    }

    .card {
      width: 100%;
      max-width: 460px; 
      text-align: center;
      position: relative;
      z-index: 1;
      padding-bottom: 20px; /* เพิ่มระยะห่างด้านล่างนิดหน่อย */
    }

    /* --- Top Actions --- */
    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
      padding-right: 10px; /* ขยับปุ่ม share เข้ามาหน่อย */
    }
    
    .circle-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.3);
      color: var(--text-main);
      display: grid; place-items: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }
    .circle-btn:hover {
      background: rgba(255,255,255,0.6);
      transform: scale(1.1);
    }

    /* --- Avatar & Profile --- */
    .avatar-container {
      position: relative;
      width: 120px; height: 120px; 
      margin: 0 auto 20px;
    }
    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255,255,255,0.4);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      animation: float 6s ease-in-out infinite;
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .handle {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 6px;
      letter-spacing: 0.5px;
    }
    .bio {
      font-size: 16px;
      color: var(--text-sub);
      margin-bottom: 40px;
      font-weight: 300;
    }

    /* --- Links List --- */
    .links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .links li {
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.5s ease forwards;
    }
    .links li:nth-child(1) { animation-delay: 0.1s; }
    .links li:nth-child(2) { animation-delay: 0.2s; }
    .links li:nth-child(3) { animation-delay: 0.3s; }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      padding: 22px 28px; 
      border-radius: var(--radius);
      background: var(--surface);
      text-decoration: none;
      color: var(--text-main);
      font-weight: 500;
      font-size: 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: var(--shadow-soft);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .link:hover {
      background: var(--surface-hover);
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-hover);
      color: #3e3221;
    }

    .link-icon {
      width: 28px; height: 28px;
      margin-right: 18px;
      fill: var(--text-main);
      transition: transform 0.3s ease;
    }
    .link:hover .link-icon {
      transform: scale(1.1) rotate(-5deg);
    }

    .link-text {
      flex: 1;
      text-align: left;
    }

    /* --- Footer --- */
    .footer-area {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: slideUp 0.5s ease forwards 0.5s;
      opacity: 0;
    }

    .legal {
      font-size: 13px;
      color: var(--text-sub);
      display: flex;
      gap: 8px;
      opacity: 0.8;
    }

  </style>
</head>

<body>
  <div class="wrap">
    
    <div class="card">
      
      <div class="top-actions">
        <button class="circle-btn" onclick="sharePage()" title="Share">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
      </div>

      <div class="avatar-container">
        <div class="avatar">
          <img src="https://drive.google.com/thumbnail?id=1XturaTMMO-Mw3bPuyeZJYhTPVk5QlltP&sz=w400" alt="Baanpaw Logo">
        </div>
      </div>

      <div class="handle">@baanpaw</div>
      <div class="bio">Pet Accessories & Carrier Bags 🐶🐱</div>

      <ul class="links">
        
        <li>
          <a class="link" href="https://lin.ee/ChQUtRS" target="_blank">
            <svg class="link-icon" viewBox="0 0 24 24">
              <path d="M19.6 11.2c0-4-3.9-7.2-8.6-7.2S2.4 7.2 2.4 11.2c0 3.6 3.1 6.7 7.3 7.1.3.1.7.2.8.5.1.2.1.6.1.8 0 .1-.1.6-.1.7 0 .2-.2.9.8.5 1-.4 5.2-3.1 7.1-5.3 1.3-1.4 1.2-2.4 1.2-2.8zM8.2 10.6H6.5v5h1.7v-5zm6.9 0h-1.7v3l-2.3-3H9.5v5h1.7v-3l2.3 3h1.6v-5zm-4.6 0H8.8v5h1.7v-5zm8.6 0h-4.2v5h4.2v-1.4h-2.5v-.6h2.5v-1.4h-2.5V12h2.5v-1.4z"/>
            </svg>
            <span class="link-text">Add LINE Friend</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </li>

        <li>
          <a class="link" href="https://www.instagram.com/baanpaw_pets/" target="_blank">
            <svg class="link-icon" viewBox="0 0 24 24">
              <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm-5 4.2a3.8 3.8 0 1 1 0 7.6 3.8 3.8 0 0 1 0-7.6zm0 2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM17.8 6.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8z"/>
            </svg>
            <span class="link-text">Follow Instagram</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </li>

        <li>
          <a class="link" href="https://s.shopee.co.th/BMw5wx0ks" target="_blank">
            <svg class="link-icon" viewBox="0 0 24 24">
               <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="link-text">Shop on Shopee</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </li>

      </ul>

      <div class="footer-area">
        <div class="legal">
          <span>© 2025 baanpaw-บ้านพอว์</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    function sharePage(){
      if(navigator.share){
        navigator.share({ title: document.title, url: location.href });
      } else {
        prompt("Copy this link:", location.href);
      }
    }
  </script>
</body>
</html>
